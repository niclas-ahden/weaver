name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release gate: roc check, roc test, the bundle sanity check and
  # ./tests.roc under the flake's compiler.
  #
  # No examples here or in the legs below, since they are run with no
  # arguments and some of them need one. ./tests.roc builds and runs them
  # with several sets of arguments and compares what they print instead.
  test:
    name: Required
    uses: niclas-ahden/roc-workflows/.github/workflows/test.yml@v3
    with:
      examples: ''
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  roc-versions:
    name: 'Optional: look up Roc versions'
    uses: niclas-ahden/roc-workflows/.github/workflows/resolve-versions.yml@v3

  # The newest downloaded nightly on every operating system, because that is
  # the compiler a user of the package has.
  latest-roc:
    name: 'Optional: latest Roc'
    needs: roc-versions
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      examples: ''
      roc: ${{ needs.roc-versions.outputs.nightly }}
      label: Tests
      opts: '["speed", "dev", "size", "interpreter"]'
